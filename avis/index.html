<body>
<header><div class="container nav"><a class="brand" href="/"><img src="/assets/logo.png" alt="Logo"><span>Lucky Réparations & Créations<small>Mouscron • Tournai et environs</small></span></a><nav class="links" id="menu"><a href="/">Accueil</a><a href="/services/">Services</a><a href="/galerie/">Galerie</a><a href="/actualites/">Actualités</a><a href="/avis/">Avis</a><a href="/faq/">FAQ</a><a href="/contact/">Contact</a><a class="cta" href="/devis/">Demander un devis</a></nav><button class="menu-btn" onclick="document.getElementById('menu').classList.toggle('open')">Menu</button></div></header>
<main><section class="page-hero"><div class="container"><h1>Avis clients</h1><p>Retours et témoignages sur les réalisations et réparations.</p></div></section><section><div class="container grid services" id="avisGrid"><article class="card"><p>Chargement des avis...</p></article></div></section></main>
<footer><div class="container">© 2026 Lucky Réparations & Créations — Mouscron • Tournai et environs</div></footer>
<script>
async function loadAvis(){
 const grid=document.getElementById("avisGrid");
 try{const r=await fetch("/content/avis.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error();const j=await r.json();const items=Array.isArray(j)?j:(j.body||j.avis||[]);items.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));grid.innerHTML=items.length?items.map(a=>`<article class="card"><h3>${"$"}{"⭐".repeat(Number(a.rating)||5)}<br>${"$"}{a.name||"Client"}</h3>${"$"}{a.date?`<p><strong>${"$"}{String(a.date).slice(0,10)}</strong></p>`:""}<p>${"$"}{a.text||a.comment||""}</p></article>`).join(""):`<article class="card"><h3>Aucun avis publié</h3><p>Les prochains avis apparaîtront ici.</p></article>`;}catch(e){grid.innerHTML='<article class="card"><h3>Aucun avis publié</h3><p>Les prochains avis apparaîtront ici.</p></article>';}
}
document.addEventListener("DOMContentLoaded",loadAvis);
</script></body></html>
